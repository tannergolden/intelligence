# REUSE (https://reuse.software) licensing metadata.
#
# Everything here is MIT and copyright Tanner Golden, matching the root
# LICENSE. One blanket annotation covers the whole tree, which is not the
# usual REUSE style and is deliberate:
#
# PAYLOAD FILES MUST NOT CARRY SPDX HEADERS. `payload/` is copied byte for
# byte into other people's repositories. A header added to satisfy a linter
# here would land in every consuming repository, inside always-loaded agent
# instruction files, where it is noise a model reads on every session and a
# copyright line the consumer did not write. The annotation lives in this
# file so the delivered bytes stay clean.
#
# The remaining file types present are markdown, python, yaml, json, sh,
# toml and the `.gitkeep` sentinels that hold empty directories open. `**`
# matches all of them, including dotfiles and dot-directories, so nothing
# needs listing and nothing falls behind when a file type is added.
#
# precedence = "aggregate": files that DO carry their own SPDX header (the
# Python under `actions/`, and the shell under `.githooks/`, which execute in
# other people's CI or on a maintainer's machine and should be
# self-describing when read in isolation) keep it. The values are identical
# either way. Nothing is emitted under `scripts/`, by rule: see check.py.
#
# The `MIT` identifier resolves to `LICENSES/MIT.txt`. That file is what
# `reuse lint` actually looks for: the root `LICENSE` is a human-facing
# convention and REUSE does not read it.
version = 1

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tanner Golden"
SPDX-License-Identifier = "MIT"
