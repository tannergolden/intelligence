# --- Composite Action ---
#
# 🧪 Check Skills
#
# Purpose: validates every skill directory against the Agent Skills
# specification and against the portability rules that keep one authored
# skill working in every supported tool.
#
# ⚠️ WHY THIS IS A GATE AND NOT A CONVENTION. Every way a skill can be wrong
# is silent. A missing SKILL.md is not an error, it is a directory nothing
# discovers. A `name` that disagrees with its directory is found under one
# name and invoked under another. A body over the size guidance is not
# rejected, it just costs the whole session. A single-tool frontmatter key
# does not warn elsewhere, it is dropped. An agent authoring a skill cannot
# catch any of that by re-reading its own work, which is the definition of a
# thing that belongs in continuous integration.
#
# STANDARD LIBRARY ONLY. This runs in other people's continuous integration.
# There is no `pip install` step here and there must never be one: a
# dependency resolution is a network call, a supply chain and a failure mode
# all at once. The runner image documents python3 and nothing else is assumed.
#
# Used as:
#
#   - uses: tannergolden/ai/actions/check-skills@v1
#     with:
#       path: skills
#
# ---

name: '🧪 Check Skills'
description: 'Validates skill directories against the Agent Skills specification and the cross-vendor portability rules.'

inputs:
  path:
    description: >-
      Directory holding one subdirectory per skill. Every subdirectory is
      checked; files at the top level are ignored.
    required: false
    default: 'skills'
  self-test:
    description: >-
      Ignore `path` and instead prove the checker still REJECTS known-bad
      input, using hostile skills built in a temporary directory. A checker
      that has never rejected anything has never been tested, and one that
      silently stopped matching looks exactly like a clean repository.
    required: false
    default: 'false'

outputs:
  errors:
    description: 'Number of errors found. Zero in self-test mode, which reports through its exit status.'
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: 'Number of warnings found.'
    value: ${{ steps.check.outputs.warnings }}

runs:
  using: composite
  steps:
    - name: '🧪 Validate Skill Directories'
      id: check
      shell: bash
      env:
        SKILLS_PATH: ${{ inputs.path }}
        SELF_TEST: ${{ inputs.self-test }}
        # The checker lives in `scripts/`, beside the documentation checker
        # and everything else the Makefile invokes, rather than inside this
        # action. A composite action is fetched with its WHOLE repository, so
        # reaching up two levels resolves in a consuming repository exactly as
        # it does here. This is the pattern the sibling publisher uses.
        SCRIPT: ${{ github.action_path }}/../../scripts/check-skills.py
      run: |
        set -uo pipefail

        if [ "$SELF_TEST" = "true" ]; then
          echo "errors=0" >> "$GITHUB_OUTPUT"
          echo "warnings=0" >> "$GITHUB_OUTPUT"
          python3 "${SCRIPT}" --self-test | tee "${RUNNER_TEMP}/self-test.txt"
          status="${PIPESTATUS[0]}"
          {
            echo "### 🧪 Skill checker self-test"
            echo ""
            echo '```text'
            cat "${RUNNER_TEMP}/self-test.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        fi

        report="${RUNNER_TEMP}/check-skills.json"
        status=0
        python3 "${SCRIPT}" "$SKILLS_PATH" --json > "$report" || status=$?

        errors=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["errors"]))' "$report")
        warnings=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["warnings"]))' "$report")
        echo "errors=${errors}" >> "$GITHUB_OUTPUT"
        echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"

        python3 "${SCRIPT}" "$SKILLS_PATH" || true

        {
          echo "### 🧪 Skill check: \`${SKILLS_PATH}\`"
          echo ""
          echo "| Result | Count |"
          echo "| :--- | ---: |"
          echo "| Errors | ${errors} |"
          echo "| Warnings | ${warnings} |"
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$status"
