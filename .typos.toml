# --- Hub Spell-Check Words ---
#
# Words the shared standards config does not know but this hub spells
# correctly. `typos` finds this file on its own and adds it to the shared
# config that the Check Spelling job passes with --config, so both lists apply.
#
# Additive, like the shared list: add the term rather than reword the sentence.
# A word a skill in kit/skills/ carries on purpose, such as a name or a term
# of art, is added here.
#
# ---

[default.extend-words]
CMO = "CMO" # a chief marketing officer, kit/skills/administration/
EIN = "EIN" # an employer identification number, kit/skills/administration/
Extraversion = "Extraversion" # the Big Five trait, as the literature spells it, kit/skills/human-resources/
yoy = "yoy" # year over year, a data key in kit/skills/administration/assets/
HSA = "HSA" # a health savings account, kit/skills/finance-and-accounting/
mis = "mis" # the prefix in hyphenated words: mis-fires, mis-called
