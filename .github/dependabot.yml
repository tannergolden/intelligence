# --- Dependency Updates ---
#
# 🤖 Dependabot
#
# Purpose: keep the SHA pins rule 4 requires from rotting.
#
# ⚠️ THIS EXISTS BECAUSE OF RULE 4, NOT IN SPITE OF IT. Pinning every action
# to an immutable commit is what the law asks for, and it buys nothing on its
# own: a pin nobody moves is a pin that keeps a fixed, eventually-vulnerable
# revision forever. The pin is the safety property; this is what makes it
# maintainable. Dependabot rewrites the SHA and the trailing version comment
# together, so the human-readable half cannot drift from the revision.
#
# ⚠️ IT OPENS PULL REQUESTS, AND `dependabot-automerge.yml` MERGES SOME OF
# THEM. Work lands in this repository by direct push, so these arrive as a
# review queue; a patch or a minor is approved and queued once the checks
# agree, and a major waits for a human.
#
# The property that queue was created to protect is untouched. An upstream
# change to `tannergolden/standards` used to reach this repository's own
# continuous integration with no review at all, because the reference was a
# moving tag: nothing named the revision and nothing recorded the change.
# Every first-party reference here is a commit, so what arrives is still a
# specific revision in a diff. Automating the click is not the same as
# restoring the moving tag, and a major, which is where a breaking change to
# a published workflow would appear, is still read by somebody.
#
# Only `github-actions` is watched. There is no package manifest in this
# repository and there must not be one: both checkers are standard library
# only, on purpose, because the skill checker ships as a composite action into
# other people's continuous integration.
#
# ⚠️ ONE SWEEP IS ONE PULL REQUEST. Ungrouped, an interval's updates arrive as
# a pull request per action, and this repository references six: three
# third-party and three into `tannergolden/standards`. A grouped sweep is one
# branch, one review and one commit for what is one decision.
#
# THE SETTINGS BELOW ARE THE ACCOUNT'S, NOT THIS REPOSITORY'S. Every
# repository that runs Dependabot runs the same configuration, cadence,
# grouping and labels alike, so the decision is made once rather than drifting
# into a slightly different file per repository. Monthly rather than weekly:
# grouping makes the cadence the only remaining source of noise, and a pin
# four weeks old is not worth a weekly interruption.
#
# ⚠️ THE COMPOSITE ACTION NEEDS NAMING SEPARATELY. Dependabot discovers
# workflows under `.github/workflows/`, and an `action.yml` anywhere else is
# invisible to it. `actions/check-skills` pins nothing today, which is exactly
# why this is a glob rather than a list: the entry that is only correct while
# a folder stays empty is the entry nobody notices going wrong.
#
# ---

version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '07:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - 'type: build'
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directories:
      - '/actions/*'
    schedule:
      interval: 'monthly'
      time: '07:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - 'type: build'
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
