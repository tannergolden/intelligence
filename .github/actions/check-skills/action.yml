# --- Composite Action ---
#
# 🧪 Check Skills
#
# Purpose: validates every skill directory against the Agent Skills
# specification and against the portability rules that keep one authored
# skill working in both supported tools.
#
# ⚠️ WHY THIS IS A GATE AND NOT A CONVENTION. Every way a skill can be wrong
# is silent. A missing SKILL.md is not an error, it is a directory nothing
# discovers. A `name` that disagrees with its directory is found under one
# name and invoked under another. A body over the size guidance is not
# rejected, it just costs the whole session. A Claude-only frontmatter key
# does not warn on Gemini, it is dropped. An agent authoring a skill cannot
# catch any of that by re-reading its own work, which is the definition of a
# thing that belongs in continuous integration.
#
# STANDARD LIBRARY ONLY. This runs in other people's continuous integration.
# There is no `pip install` step here and there must never be one: a
# dependency resolution is a network call, a supply chain and a failure mode
# all at once. The runner image documents python3 and nothing else is assumed.
#
# Used as:
#
#   - uses: tannergolden/ai/.github/actions/check-skills@v1
#     with:
#       path: skills
#
# ---

name: '🧪 Check Skills'
description: 'Validates skill directories against the Agent Skills specification and the cross-vendor portability rules.'

inputs:
  path:
    description: >-
      Directory holding one subdirectory per skill. Every subdirectory is
      checked; files at the top level are ignored.
    required: false
    default: 'skills'
  expect-failure:
    description: >-
      Invert the result, so the step passes only when the checker REJECTS
      what it was given. Used against the hostile fixtures: a checker that
      has never failed is not a checker, and one that silently stopped
      matching looks exactly like a clean repository.
    required: false
    default: 'false'

outputs:
  errors:
    description: 'Number of errors found.'
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: 'Number of warnings found.'
    value: ${{ steps.check.outputs.warnings }}

runs:
  using: composite
  steps:
    - name: '🧪 Validate Skill Directories'
      id: check
      shell: bash
      env:
        SKILLS_PATH: ${{ inputs.path }}
        EXPECT_FAILURE: ${{ inputs.expect-failure }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -uo pipefail
        report="${RUNNER_TEMP}/check-skills.json"
        status=0
        python3 "${ACTION_PATH}/check-skills.py" "$SKILLS_PATH" --json > "$report" || status=$?

        # A non-zero exit alone is too weak a claim when inverting: a crash
        # would satisfy it, including one that means no rule ever ran. So the
        # report is parsed and the counts are read from it.
        errors=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["errors"]))' "$report")
        warnings=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["warnings"]))' "$report")
        echo "errors=${errors}" >> "$GITHUB_OUTPUT"
        echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"

        python3 "${ACTION_PATH}/check-skills.py" "$SKILLS_PATH" || true

        {
          echo "### 🧪 Skill check: \`${SKILLS_PATH}\`"
          echo ""
          echo "| Result | Count |"
          echo "| :--- | ---: |"
          echo "| Errors | ${errors} |"
          echo "| Warnings | ${warnings} |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$EXPECT_FAILURE" = "true" ]; then
          if [ "$errors" -eq 0 ]; then
            echo "::error title=Check Skills::The hostile fixtures were ACCEPTED. The rules have stopped matching, which looks exactly like a clean repository and is not one."
            exit 1
          fi
          echo "The hostile fixtures were rejected with ${errors} error(s), as they must be."
          exit 0
        fi

        exit "$status"
