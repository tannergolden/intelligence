# Installed from tannergolden/standards. Edit freely: this file is YOURS.
#
# Publishes the hub's releases: `vX.Y.Z` for the version, and the moving
# `vX` beside it. A release is what everything downstream pins: dotfiles'
# `make agents` and the Claude cloud setup script download
# `home/intelligence.md`, `home/kit.json` and `scripts/install.py` from the
# tag, and check each against its SHA-256; every repository's
# 🔁 Intelligence Sync stub runs `sync.yml` and `actions/sync` at the moving
# `vX`, so moving it is what delivers the block to them; and `make sync`
# delivers the block of the latest tag.
# A merge to the default branch reaches none of them until a release is cut.
#
# ADOPTED FROM THE TEMPLATE, as its note said to for a repository consumed by
# tag: the `if:` guard that kept it inert is gone, and `required-files` and
# `check-command` name what this hub ships. `make check` fails a release whose
# rendered copies have drifted from the law, so a tag can never serve a home
# file the law did not produce.
#
# Every version stays: releases are never pruned (see release.yml), because a
# pin to a full version must keep resolving and `make audit` names old blocks
# by the release that shipped them.
#
# NOTHING FANS OUT FROM HERE. This hub holds no credential that reaches
# another repository: each stub picks the release up on its next Monday run,
# or when its owner runs it, and `make sync` reaches every repository at once.

name: '🏷️ Cut Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, as vX.Y.Z'
        required: true
        type: string
      move-major:
        description: 'Also move the major tag (vX) to this release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write # create tags, publish the release, prune superseded pages
    uses: tannergolden/standards/.github/workflows/release.yml@v1
    with:
      version: ${{ inputs.version }}
      move-major: ${{ inputs.move-major }}
      # A release a consumer could not install from is refused here, rather
      # than discovered by the first machine, or the first stub, that tries.
      # The second line is what a stub resolves at the tag, and
      # setup/test_stub.py keeps it whole.
      required-files: >-
        AGENTS.md home/intelligence.md home/kit.json home/SHA256SUMS scripts/install.py setup/claude-cloud-setup.sh
        .github/workflows/sync.yml actions/sync/action.yml setup/intelligence-sync.yml scripts/sync.py scripts/render.py scripts/kit.py
      check-command: 'make check'
