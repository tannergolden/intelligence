# --- This Repository's Own CI ---
#
# 🧪 CI
#
# Purpose: the only test this repository's code gets before it runs inside
# somebody else's continuous integration, holding a token that can write to
# their default branch.
#
# ⚠️ THIS REPORTS, IT DOES NOT GATE, AND THAT IS NOT AN OVERSIGHT. There are
# no pull requests here by design: the product is a distribution path with no
# review step in it, so nothing merges and a required status check would have
# nothing to gate. `required_status_checks` is documented as a merge-time
# rule ("before collaborators can merge"), and there are no merges. What
# these jobs buy instead is a red mark on a commit while the person who wrote
# it is still looking at it, and before a release carries that commit to
# every consuming repository at once.
#
# THE ORDER THE JOBS ARE WRITTEN IN IS THE ORDER THEY MATTER IN. The second
# one is the most important file in this repository:
#
#   A CHECKER THAT HAS NEVER FAILED IS NOT A CHECKER.
#
# `check.py` is the only thing standing between a defect and two vendors'
# always-loaded instruction files in six working trees. It is asserted
# against hostile fixtures that MUST make it exit non-zero, because a linter
# that silently stopped matching would otherwise look exactly like a clean
# repository.
#
# Every job here runs on the standard runner image and uses only what that
# image documents: python3, jq and gh. Nothing installs anything.
#
# ---

name: '🧪 CI'

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # 1. The bytes that ship.
  # ---------------------------------------------------------------------------
  payload:
    name: '🔎 Check the Payload'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read this repository
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same command the composite action runs at the consumer, against
      # the same bytes. If this is red, no release may be cut.
      - name: '🔎 Lint the payload'
        run: python3 actions/ai-sync/check.py payload/

      # The two engines each hold their own copy of the frozen command prefix:
      # `check.py` asserts the payload still spells it that way, and `sync.py`
      # uses it to decide which entries in a consumer's settings file are ours
      # to replace or retire. They cannot be one constant without an import,
      # and an import would put a first-party module on a stdlib-only
      # allowlist. So they are two literals, and this is the assertion that
      # they are the same two literals. If they ever drift, `check.py` blesses
      # a command `sync.py` no longer recognises: our hook entry stops being
      # ours, is never updated, is never retired, and accumulates a duplicate
      # on every release.
      - name: '🔗 Both engines spell the frozen prefix the same way'
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          PATTERN = re.compile(r"^HOOK_PREFIX = (.+)$", re.M)
          seen = {}
          for name in ("check.py", "sync.py"):
              source = pathlib.Path("actions/ai-sync", name).read_text(encoding="utf-8")
              found = PATTERN.findall(source)
              if len(found) != 1:
                  print(f"::error title=Frozen prefix::{name} defines HOOK_PREFIX {len(found)} times; expected exactly one.")
                  sys.exit(1)
              seen[name] = found[0].strip()

          if len(set(seen.values())) != 1:
              print(f"::error title=Frozen prefix::the engines disagree: {seen}.")
              print("::error title=Frozen prefix::check.py would accept a hook command sync.py does not own, so that entry could never be updated or retired in any consumer.")
              sys.exit(1)
          print(f"Both engines agree: HOOK_PREFIX = {seen['check.py']}")
          PY

  # ---------------------------------------------------------------------------
  # 2. THE MOST IMPORTANT JOB IN THIS FILE.
  # ---------------------------------------------------------------------------
  checker:
    name: '🧪 The Checker Must Fail'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the fixtures
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A non-zero exit alone is too weak a claim: any crash would satisfy it,
      # including an ImportError that means the rules never ran at all. So the
      # named rules are asserted too. The assertion is a SUBSET check, so
      # adding a fixture never breaks this job, while deleting a rule does.
      - name: '🧪 Hostile fixtures must be rejected'
        run: |
          set -uo pipefail
          status=0
          # `--any-path` because the fixtures are hostile inputs rather than
          # the emit set: their filenames are dictated by the rules under
          # test, so the emitted-path allowlist has nothing to say here. The
          # escape hatch stays on, because at-hazard.md asserts it works.
          python3 actions/ai-sync/check.py tests/fixtures --json --any-path \
            > "${RUNNER_TEMP}/fixtures.json" || status=$?
          export AI_STATUS="$status"
          python3 - <<'PY'
          import json, os, pathlib, sys

          # Every rule that must still be capable of firing, each with a
          # hostile fixture written to trip it. A rule with no fixture is a
          # rule nobody would notice going quiet, so this set and
          # tests/fixtures/ grow together or not at all.
          #
          # `shape` is deliberately absent: its subjects are the payload's own
          # settings file and hook scripts, which the fixture directory does
          # not have and should not grow a fake copy of. It is exercised
          # instead by the payload job, on the real files.
          REQUIRED = {"at-strict", "invisible", "shellbang", "permalink"}

          status = int(os.environ["AI_STATUS"])
          report = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "fixtures.json").read_text())
          fired = {v["rule"] for v in report["violations"]}

          problems = []
          if status == 0:
              problems.append(
                  "check.py exited 0 on tests/fixtures. The fixtures are hostile by "
                  "construction, so a clean pass means the rules stopped matching.")
          missing = sorted(REQUIRED - fired)
          if missing:
              problems.append(
                  f"these rules did not fire on the fixtures: {missing}. Either the "
                  "rule was weakened or its fixture was deleted; both are silent "
                  "failures in production and neither is acceptable here.")

          for problem in problems:
              print(f"::error title=Checker::{problem}")
          print(f"check.py exited {status}; rules that fired: {sorted(fired)}")
          sys.exit(1 if problems else 0)
          PY

  # ---------------------------------------------------------------------------
  # 3. The dependency surface, which must stay at zero.
  # ---------------------------------------------------------------------------
  stdlib:
    name: '📦 Standard Library Only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the engine
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This code runs inside other people's CI. A `pip install` there is a
      # network call, a supply chain and a failure mode all at once, and the
      # runner image documents python3 without documenting PyYAML or anything
      # else. Asserting the import set directly settles the question
      # permanently, which is also why there is no `pip` block in
      # dependabot.yml: there is no requirements file to update, and there
      # never will be.
      #
      # Two claims, not one: the module must be on the declared allowlist AND
      # python must agree it is standard library. The second catches a name
      # added to the list by hand that is really a third-party package.
      - name: '📦 The engine imports nothing but the standard library'
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys

          ALLOWED = {
              "__future__", "argparse", "ast", "base64", "dataclasses", "datetime",
              "difflib", "fnmatch", "hashlib", "io", "json", "os", "pathlib", "re",
              "shutil", "stat", "string", "subprocess", "sys", "tempfile",
              "textwrap", "typing", "unicodedata",
          }

          problems = []
          not_stdlib = sorted(ALLOWED - set(sys.stdlib_module_names))
          if not_stdlib:
              problems.append(
                  f"the allowlist names {not_stdlib}, which python does not consider "
                  "standard library. Remove them; an allowlist that can be widened by "
                  "hand to admit a package is not an allowlist.")

          sources = sorted(pathlib.Path("actions").rglob("*.py"))
          if not sources:
              problems.append("no python found under actions/. This job just stopped checking anything.")

          for path in sources:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      # A relative import has no module of its own to police.
                      names = [node.module] if node.level == 0 and node.module else []
                  else:
                      continue
                  for name in names:
                      top = name.split(".")[0]
                      if top not in ALLOWED:
                          problems.append(f"{path}:{node.lineno}: imports {name!r}, which is not on the allowlist")

          for problem in problems:
              print(f"::error title=Stdlib only::{problem}")
          print(f"{len(sources)} file(s) checked against {len(ALLOWED)} allowed modules.")
          sys.exit(1 if problems else 0)
          PY

  # ---------------------------------------------------------------------------
  # 4. Two repository settings that break consumers rather than this repo.
  # ---------------------------------------------------------------------------
  repository:
    name: '🌐 Public, With Issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read from the event payload rather than the API, so this job needs no
      # token and no permissions at all. Both triggers carry a full
      # `repository` object.
      #
      # PUBLIC: a private publisher does not fail here, it fails in every
      # consumer, at action resolution, with a message about a repository that
      # "does not exist" - the single most misleading failure this design can
      # produce, and the only one a consumer cannot diagnose from their own
      # repository.
      #
      # ISSUES: this repository is the fleet's failure intake by design.
      # Turning issues off would leave every failure report with nowhere to
      # land and nothing would say so.
      - name: '🌐 The publisher must be reachable'
        env:
          PRIVATE: ${{ github.event.repository.private }}
          HAS_ISSUES: ${{ github.event.repository.has_issues }}
        run: |
          set -euo pipefail
          fail=0
          if [ -z "$PRIVATE" ] || [ -z "$HAS_ISSUES" ]; then
            echo "::error title=Repository::The event payload carried no repository visibility. This check cannot pass by accident."
            exit 1
          fi
          if [ "$PRIVATE" != "false" ]; then
            echo "::error title=Repository::This repository is private. Every consumer breaks at action resolution with a message that says the repository does not exist."
            fail=1
          fi
          if [ "$HAS_ISSUES" != "true" ]; then
            echo "::error title=Repository::Issues are disabled. This repository is the fleet's failure intake; there is nowhere else for a report to go."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Public, with issues enabled."

  # ---------------------------------------------------------------------------
  # 5. Scaffolding must never reach a consumer.
  # ---------------------------------------------------------------------------
  scaffolding:
    name: '🧹 Scaffolding Never Ships'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the payload
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A `.gitkeep` holds an empty directory open in git and is meaningless
      # anywhere else. Delivered to a consumer it is an unexplained empty file
      # plus a lock entry that outlives the directory it was holding open.
      #
      # ASSERTED AGAINST THE EMIT SET, NOT THE TREE. `payload/.agents/skills/`
      # is deliberately empty until a skill exists, so its sentinel is
      # correct and must stay. What must never happen is one of them reaching
      # a consumer, so this drives BOTH engines and asserts on what they say
      # they would deliver. Filtering in one and forgetting the other is
      # exactly the bug this catches.
      - name: '🧹 No sentinel appears in the emit set'
        run: |
          set -euo pipefail
          target="$(mktemp -d)"

          python3 actions/ai-sync/check.py payload --json > "${RUNNER_TEMP}/payload.json"
          python3 actions/ai-sync/sync.py --plan --target "$target" --payload payload \
            | tee "${RUNNER_TEMP}/plan.txt"

          fail=0
          if grep -q '"\.gitkeep"' "${RUNNER_TEMP}/payload.json" \
             || grep -q '/\.gitkeep"' "${RUNNER_TEMP}/payload.json"; then
            echo "::error title=Scaffolding::check.py lists a .gitkeep in the emit set."
            fail=1
          fi
          if grep -q '\.gitkeep' "${RUNNER_TEMP}/plan.txt"; then
            echo "::error title=Scaffolding::sync.py would deliver a .gitkeep."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Neither engine would deliver a .gitkeep."

  # ---------------------------------------------------------------------------
  # 6. The ceiling, which is invisible from every other angle.
  # ---------------------------------------------------------------------------
  ceiling:
    name: '🔬 Permission Ceiling'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the workflow and the lock
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ⚠️ A CALLER'S `permissions:` IS A CEILING, NOT A GRANT. Ask for less
      # than sync-ai.yml declares and the consumer's run fails at STARTUP:
      # no job, no step, no log, nothing in the Actions tab to read. Ask for
      # more and the consumer has handed a workflow scopes nobody declared.
      #
      # `ceiling.lock` is the number a consumer stub must copy, and it is
      # frozen for the life of v1. Changing sync-ai.yml's permissions is
      # therefore a BREAKING change to every consumer, which is exactly what
      # this job is here to make impossible to do by accident.
      #
      # THREE FILES, ONE NUMBER: `sync-ai.yml` declares it, `ceiling.lock`
      # records it, and `bootstrap/ai-sync.yml` is the stub a consumer copies.
      # All three are compared here, because the stub is the only one of the
      # three whose disagreement is invisible from every side: a consumer
      # whose ceiling is too narrow fails at STARTUP with no job, no step and
      # no log, and nothing in this repository would otherwise notice.
      #
      # The scraper is deliberately line-oriented rather than a YAML parse:
      # the runner image documents no YAML library, this repository imports
      # nothing outside the standard library, and one regex over files this
      # repository owns is a smaller thing to get wrong than a hand-rolled
      # parser. Both YAML files carry a comment saying their permission blocks
      # are read from here.
      - name: '🔬 The workflow, the lock and the stub declare one ceiling'
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          RANK = {"none": 0, "read": 1, "write": 2}
          SCOPE = re.compile(r"^(\s+)([a-z-]+):\s+(none|read|write)\s*(#.*)?$")
          BLOCK = re.compile(r"^(\s*)permissions:\s*(#.*)?$")

          def declared(path):
              """The union of every job-level permission block in a workflow.

              `write` beats `read` wherever both appear, so the answer does not
              depend on the order the jobs happen to be written in.
              """
              want = {}
              indent = None
              for line in path.read_text(encoding="utf-8").split("\n"):
                  if indent is not None:
                      hit = SCOPE.match(line)
                      if hit and len(hit.group(1)) > indent:
                          scope, level = hit.group(2), hit.group(3)
                          if RANK[level] > RANK.get(want.get(scope, "none"), 0):
                              want[scope] = level
                          continue
                      if line.strip() and not line.lstrip().startswith("#"):
                          indent = None
                  # `permissions: {}` carries a value and opens no block.
                  opener = BLOCK.match(line)
                  if opener:
                      indent = len(opener.group(1))
              return want

          def recorded(path):
              lock = {}
              for n, line in enumerate(path.read_text(encoding="utf-8").split("\n"), 1):
                  body = line.split("#", 1)[0].strip()
                  if not body:
                      continue
                  scope, _, level = body.partition(":")
                  level = level.strip()
                  if level not in RANK:
                      raise SystemExit(f"::error title=Ceiling::ceiling.lock:{n}: {line!r} is not `scope: level`.")
                  lock[scope.strip()] = level
              return lock

          want = declared(pathlib.Path(".github/workflows/sync-ai.yml"))
          lock = recorded(pathlib.Path("ceiling.lock"))
          stub = declared(pathlib.Path("bootstrap/ai-sync.yml"))

          if not lock:
              print("::error title=Ceiling::ceiling.lock is empty. It is the contract, not a cache.")
              sys.exit(1)

          problems = False
          if want != lock:
              missing = {k: v for k, v in want.items() if lock.get(k) != v}
              extra = {k: v for k, v in lock.items() if k not in want}
              print(f"::error title=Ceiling::sync-ai.yml declares {want}; ceiling.lock records {lock}.")
              if missing:
                  print(f"::error title=Ceiling::not in the lock, or too narrow there: {missing}. A consumer copying the lock would fail at startup with no log.")
              if extra:
                  print(f"::error title=Ceiling::in the lock but no longer declared: {extra}. Consumers are granting scopes nobody asks for.")
              problems = True
          if stub != lock:
              print(f"::error title=Ceiling::bootstrap/ai-sync.yml declares {stub}; ceiling.lock records {lock}.")
              print("::error title=Ceiling::That stub is the file every consumer copies. Shipping it too narrow gives them a run that dies at startup with nothing in the Actions tab to read.")
              problems = True
          if problems:
              print("::error title=Ceiling::If this change is intended it is a BREAKING change: every consumer stub must be edited before it is released.")
              sys.exit(1)

          print(f"sync-ai.yml, ceiling.lock and bootstrap/ai-sync.yml agree: {lock}")
          PY

  # ---------------------------------------------------------------------------
  # 7. Licensing, because the output is copied into other people's repositories.
  # ---------------------------------------------------------------------------
  reuse:
    name: '📄 REUSE Compliance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the tree and LICENSES/
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A publisher whose output is copied into other repositories with no
      # license is legally unusable by anyone but its owner. The blanket
      # annotation in REUSE.toml is what keeps SPDX headers OUT of `payload/`,
      # where they would land in every consumer's always-loaded instructions.
      - name: '📄 REUSE Lint'
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
