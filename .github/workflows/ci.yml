# --- This Repository's Own CI ---
#
# ✨ CI Validation
#
# Purpose: the shared validation gate, consumed rather than reimplemented.
#
# ⚠️ THIS IS A STUB ON PURPOSE. Spelling, link checking and documentation
# linting are published once as a reusable workflow in tannergolden/standards
# and followed BY LINK, NEVER BY COPY. An earlier version of this repository
# hand-wrote its own copies of the shared jobs; a fix upstream would never
# have reached it, in a repository whose own law says the standards are
# followed by link. One `uses:` line is the whole correction.
#
# NOTHING IS PASSED IN, AND THAT IS THE POINT. Each stage resolves to the
# `make` target of the same name, which is the shape the shared workflow
# describes for a repository that already routes everything through a
# Makefile. It also fixes a gate that was never running: `lint-docs` is the
# one stage with NO input override, so before the Makefile existed the
# documentation step reported "skipped" on every green run, and the rule
# AGENTS.md calls the one broken most often was checked by nothing.
#
# The dedicated skill gate lives in skills.yml, which also carries the
# negative test that proves the checker can still fail.
#
# ---

name: '✨ CI Validation'

on:
  push:
    branches: ['Development']
  workflow_dispatch:

concurrency:
  # In-progress runs are never canceled, so a report cannot vanish midway.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    permissions:
      contents: read # read this repository
    uses: tannergolden/standards/.github/workflows/ci.yml@v1
    with:
      # No SPDX headers and no LICENSES/ directory here: the published files
      # are copied verbatim into other people's trees, where a license header
      # inside an always-loaded instruction file is noise a model reads every
      # session. The root LICENSE carries the license instead.
      reuse-check: false
