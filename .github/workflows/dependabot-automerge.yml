# --- This Repository's Own Dependabot Automation ---
#
# 🦾 Automate Dependabot
#
# Purpose: approve and queue Dependabot's patch and minor updates, so a pin
# that has to move to stay safe is not held open by a click.
#
# Called, never copied. The logic is published once in tannergolden/standards
# and this file holds the trigger and nothing else.
#
# ⚠️ THIS NARROWS AN EARLIER POSITION, AND THE NARROWING IS THE POINT.
# `dependabot.yml` used to say that nothing here merges these, because a
# moving tag had once carried an upstream change into this repository's
# continuous integration with no review at all. The pins are still commits
# rather than tags, so that property is intact: what arrives is a specific
# revision, named in a diff. What changes is who clicks merge on a patch or a
# minor once the checks agree. A major still waits for a human, which is where
# a breaking change to a published workflow would actually appear.
#
# PINNED TO A COMMIT, like every other first-party reference here.
#
# NO `timeout-minutes`, because a job that calls a reusable workflow cannot
# carry one. The called workflow sets its own, per job.
#
# The Dependabot author check lives in the called workflow, keyed to the pull
# request author rather than the actor, so nothing here repeats it.
#
# ---

name: '🦾 Automate Dependabot'

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  dependabot:
    permissions:
      contents: write # allow the squash merge once required checks pass
      pull-requests: write # approve the pull request
    uses: tannergolden/standards/.github/workflows/dependabot-automerge.yml@a6ee0c23a1614b75a69353190dd7dd67faf59101 # v1.6.0
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at the ref pinned above.
