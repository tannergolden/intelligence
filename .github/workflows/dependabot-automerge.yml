# --- This Repository's Own Dependabot Automation ---
#
# 🦾 Automate Dependabot
#
# Purpose: approve and queue Dependabot's patch and minor updates, so a pin
# that has to move to stay safe is not held open by a click.
#
# Called, never copied. The logic is published once in tannergolden/standards
# and this file holds the trigger and nothing else.
#
# ⚠️ THIS REVERSES AN EARLIER POSITION, AND THE REVERSAL IS DELIBERATE.
# `dependabot.yml` used to say that nothing here merges these, and every
# first-party reference used to be a commit, both for the same reason: a
# moving tag had once carried an upstream change into this repository's
# continuous integration with no review at all.
#
# The account settled the question the other way, and uniformly. `@v1` is the
# pin everywhere, because a tag that moves is what lets a fix land once
# upstream and reach every repository, which is the whole argument for sharing
# the logic rather than copying it. Review moves with it: the release that
# repoints the tag is the thing somebody reads, rather than a pull request in
# each of six repositories saying the same thing. What is left here for a
# human is a major, which the tag never crosses and the automation never
# merges.
#
# `@v1`, like every other first-party reference here.
#
# NO `timeout-minutes`, because a job that calls a reusable workflow cannot
# carry one. The called workflow sets its own, per job.
#
# The Dependabot author check lives in the called workflow, keyed to the pull
# request author rather than the actor, so nothing here repeats it.
#
# ---

name: '🦾 Automate Dependabot'

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  dependabot:
    permissions:
      contents: write # allow the squash merge once required checks pass
      pull-requests: write # approve the pull request
    uses: tannergolden/standards/.github/workflows/dependabot-automerge.yml@v1
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at the ref pinned above.
