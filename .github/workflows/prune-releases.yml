# --- Reusable Workflow ---
#
# 🧹 Prune Releases
#
# Purpose: keeps the Releases page showing what is current, by deleting
# PUBLISHED releases that a newer one has superseded. The most recent `keep`
# releases survive; everything older is removed.
#
# ⚠️ THIS DELETES PUBLISHED RELEASES. The notes are the only changelog this
# repository has, and someone may have linked to them.
#
# ⚠️ DELETING A RELEASE DOES NOT DELETE ITS TAG unless you ask. A release is
# a page; a tag is a contract. `vX.Y.Z` is documented in release.yml as
# immutable, and anything pinned to it keeps resolving after its release page
# is gone.
#
# ---
#
# ⚠️ WHY THIS DIVERGES FROM THE SIBLING PUBLISHER, AND WHY THAT DIVERGENCE IS
# THE WHOLE POINT OF READING THIS FILE.
#
# `tannergolden/standards` calls its copy with `keep: 1, delete-tags: true`.
# It can, because every stub there pins the moving major `@v1` and nothing
# pins a full version, so a superseded `v1.2.0` has nothing resolving to it.
#
# THAT IS NOT TRUE HERE. This repository's contract explicitly permits a
# consumer to pin an exact `vX.Y.Z`, and its whole reason for existing is
# that the delivery is pinned and reproducible. Deleting a version tag would
# break every consumer pinned to it, at action resolution, with a message
# saying the repository does not exist. So `delete-tags` is false and the
# caller in release.yml passes it explicitly rather than relying on the
# default.
#
# THE DAMAGE IS NOT HYPOTHETICAL. In `standards` today the surviving release
# body links to a tag that its own prune deleted. That is the cheap version
# of this mistake: a dead link. The expensive version is a consumer whose
# pinned version stops resolving, and this file is where it would happen.
#
# `keep: 5` rather than 1 for the same reason: the release notes of the
# versions people may still be pinned to should remain readable.
#
# ⚠️ A BARE MAJOR TAG IS NEVER DELETED, whatever `delete-tags` says. `v1` is
# the pointer every consumer resolves. It carries no release, so the prune
# should never see it, and the guard below means a stray release attached to
# one cannot take it out.
#
# The release list is snapshotted in full before anything is deleted.
# Deleting while pagination is still fetching shifts the pages underneath the
# iterator, which double-visits some entries and 404s on others.
#
# `dry-run` defaults to TRUE, so a caller that forgets the input gets a plan
# rather than a deletion, which is the right way round for something
# irreversible.
#
# ---

name: '🧹 Prune Releases'

on:
  workflow_call:
    inputs:
      keep:
        description: 'How many of the most recent published releases to keep.'
        required: false
        type: number
        default: 5
      dry-run:
        description: 'Log what would be deleted and delete nothing.'
        required: false
        type: boolean
        default: true
      include-prereleases:
        description: 'Consider prereleases for deletion too. Off by default, so a prerelease line is never pruned by a stable release.'
        required: false
        type: boolean
        default: false
      delete-tags:
        description: 'Also delete the tag behind each deleted release. Breaks every pin to that version, and this repository permits exact-version pins.'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  prune:
    name: '🧹 Delete Superseded Releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # deleting releases, and optionally their tags, requires write
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '🧹 Prune'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry-run }}
          INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
          DELETE_TAGS: ${{ inputs.delete-tags }}
        run: |
          set -euo pipefail

          # Keeping zero releases would empty the page in one run, and no
          # caller means that. Refuse rather than interpret it.
          if [ "$KEEP" -lt 1 ]; then
            echo "::error title=Prune releases::keep must be at least 1; got ${KEEP}. Refusing to delete every release."
            exit 1
          fi

          # Snapshot the FULL list before deleting anything: see the header.
          gh api --paginate "repos/${REPO}/releases" --jq '.[] | @json' > /tmp/releases.jsonl

          # Drafts are somebody else's job. Prereleases are excluded unless
          # asked for, so cutting a stable release never removes a prerelease
          # line someone is still testing against.
          ordered="$(jq -s \
            --argjson pre "$INCLUDE_PRERELEASES" '
              map(select(.draft == false))
              | (if $pre then . else map(select(.prerelease == false)) end)
              | sort_by(.published_at)
              | reverse
            ' /tmp/releases.jsonl)"

          total="$(jq 'length' <<<"$ordered")"
          doomed="$(jq --argjson keep "$KEEP" '.[$keep:]' <<<"$ordered")"
          count="$(jq 'length' <<<"$doomed")"

          echo "Eligible releases: ${total}   keeping: ${KEEP}   deleting: ${count}"
          echo

          jq -r --argjson keep "$KEEP" '.[:$keep][] | "  KEEP    \(.tag_name)  (\(.published_at))"' <<<"$ordered"
          jq -r '.[] | "  DELETE  \(.tag_name)  (\(.published_at))"' <<<"$doomed"
          echo

          if [ "$count" -eq 0 ]; then
            echo "Nothing to prune."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing was deleted. Set dry-run: false to apply this plan."
            exit 0
          fi

          if [ "$DELETE_TAGS" = "true" ]; then
            echo "::warning::delete-tags is on. Every consumer pinned to a full version below stops resolving. This repository's contract permits those pins; be certain."
          fi

          while read -r tag; do
            args=(--yes)
            if [ "$DELETE_TAGS" = "true" ]; then
              # A bare major is the moving pointer consumers pin, not a
              # release artifact. Never delete one, whatever was asked for.
              if printf '%s' "$tag" | grep -qE '^v[0-9]+$'; then
                echo "::notice::Keeping the tag ${tag}: a bare major is a moving pointer, not a version."
              else
                args+=(--cleanup-tag)
              fi
            fi
            echo "Deleting release ${tag}"
            gh release delete "$tag" --repo "$REPO" "${args[@]}"
          done < <(jq -r '.[].tag_name' <<<"$doomed")

          echo
          echo "Deleted ${count} release(s)."
