# --- This Repository's Own Supply-Chain Audit ---
#
# 🎯 OpenSSF Scorecard
#
# Purpose: an INDEPENDENTLY COMPUTED score for the claims this repository
# makes about itself. Everything else in this tree is a control this
# repository wrote, asserted with a job this repository also wrote. Scorecard
# is the one check here that nobody in this repository can tune: it reads
# token permissions, pinned dependencies, dangerous workflow patterns and
# branch protection from the outside and publishes the result.
#
# WHY IT IS HERE AND `codeql.yml` IS NOT. This is roughly three hundred lines
# of standard-library Python with no network, no `eval` and no
# deserialisation, so a SAST pass over it has almost nothing to find. What is
# genuinely exposed is the SUPPLY CHAIN: this repository is public, and its
# code executes in other people's continuous integration holding
# `contents: write` on their default branch. That is the thing worth auditing
# from the outside, and it is the distinction to keep in mind before deleting
# either file.
#
# ⚠️ NO `run:` STEP MAY BE ADDED TO THE JOB BELOW. The Scorecard publish
# service verifies the calling workflow and rejects results from a job that
# contains anything outside its allowlist of `uses:` steps. A house-style
# notice step here would silently stop the publication rather than fail.
#
# ---

name: '🎯 OpenSSF Scorecard'

on:
  schedule:
    - cron: '41 6 * * 1' # weekly, Monday, off the hour to miss the :00 crowd
  push:
    branches: ['Development']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  analysis:
    name: '🎯 Scorecard Analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publication authenticity
      contents: read # check out the repository under audit
      actions: read # let Scorecard read the workflow configuration
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `publish_results` is read from the event payload rather than hardcoded
      # to true: publication is accepted only for public repositories, so a
      # private fork would otherwise fail every weekly run forever.
      - name: '🎯 Run Scorecard'
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.private == false }}

      - name: '📊 Upload to Code Scanning'
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: scorecard-results.sarif
