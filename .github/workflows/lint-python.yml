# --- This Repository's Own Python Lint ---
#
# 🐍 Lint Python
#
# Purpose: the gate on the three programs that decide what ships.
#
# ⚠️ THERE WAS NO STATIC ANALYSIS AT ALL. Three thousand lines of Python
# decide whether a skill is publishable, whether a document satisfies the
# styling standard, and what bytes go into a release archive, and nothing read
# them but a person. The `# noqa: E402` directives in both checkers are the
# tell: the code was written for a linter that had never been run.
#
# ⚠️ THIS CANNOT BE A `make` TARGET, and that is deliberate rather than
# awkward. `make setup` says there is nothing to install, and the reason is
# load-bearing: the skill checker ships as a composite action into other
# people's continuous integration, where a dependency resolution is a network
# call, a supply chain and a failure mode at once. Adding a tool to `make lint`
# would make that claim false for everyone who runs it.
#
# So this joins spelling and link checking as a gate `make` cannot run, which
# Checks & Gates already describes as a category. The cost is stated there: a
# clean `make lint-docs` is not the same claim as a clean CI run.
#
# ---

name: '🐍 Lint Python'

on:
  push:
    branches: ['Development']
    paths:
      - '**.py'
      - '.github/workflows/lint-python.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ruff:
    name: '🐍 Ruff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the source
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🐍 Python lint: static analysis over the checkers and the packager.'

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ⚠️ THE VERSION IS PINNED, and the first run of this workflow is why.
      # Without it the action resolves "latest", so the gate ran 0.15.8 on the
      # machine it was written on and 0.16.1 in CI, with a different default
      # rule set and eighteen findings that no local run could reproduce. The
      # rules are pinned beside it in `ruff.toml`. Both halves are needed: one
      # fixes which tool runs, the other fixes what it looks for.
      - name: '🐍 Ruff'
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6
        with:
          version: '0.15.8'
          args: 'check --output-format github'
