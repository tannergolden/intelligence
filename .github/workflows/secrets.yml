# --- This Repository's Secret Scan ---
#
# 🔍 Scan for Secrets
#
# Purpose: gitleaks over the full history, called from tannergolden/standards.
#
# ⚠️ RULESET-LOAD-BEARING JOB ID. A called workflow reports its check as
# `<job id> / <job name>`, so branch protection is keyed to the id below.
# `secrets` is the id the published rulesets expect. Rename it and protection
# waits on a check that never reports, and a skipped required check never
# concludes: it waits forever.
#
# THE HISTORY IS THE POINT, not the working tree. A credential removed in a
# later commit is still in the pack file, still fetched by every clone, and
# still valid until it is rotated. This repository publishes files that are
# copied verbatim into other people's trees, so a leak here travels.
#
# `@v1`, like every first-party reference here.
#
# ---

name: '🔍 Scan for Secrets'

on:
  push:
    branches: ['Development']
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly, so a leak in untouched history is still found
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # RULESET-LOAD-BEARING JOB ID: reports as 'secrets / 🔍 Scan for Secrets'.
  secrets:
    permissions:
      contents: read # full-history checkout for the secret scan
      issues: write # one-time escalation issue when scanning is silently off
    uses: tannergolden/standards/.github/workflows/gitleaks.yml@v1
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at the ref pinned above.
