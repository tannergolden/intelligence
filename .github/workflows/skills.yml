# --- This Repository's Own Skill Gate ---
#
# 🧪 Skills
#
# Purpose: the gate that stops a malformed skill being published, and the
# test that proves the gate still works.
#
# TWO JOBS, AND THE SECOND IS THE IMPORTANT ONE:
#
#   published   the real skills under skills/.unpackaged/ must pass
#   checker     the checker must still REJECT known-bad input
#
# A checker that has never rejected anything has never been tested, and one
# that silently stopped matching is indistinguishable from a clean
# repository. The hostile input lives inside `check-skills.py` rather than in
# a fixtures directory, so a rule and the thing that proves it works cannot
# be deleted separately or drift apart.
#
# ⚠️ THIS REPORTS, IT DOES NOT GATE A MERGE, and that is not an oversight.
# Work lands here by direct push, so nothing merges and a required status
# check would have nothing to sit in front of. What it buys is a red mark on
# the commit while the person who wrote it is still looking at it, and before
# a tag moves and carries it to everyone.
#
# ---

name: '🧪 Skills'

on:
  push:
    branches: ['Development']
    paths:
      - 'skills/**'
      - 'actions/check-skills/**'
      - 'scripts/check-skills.py'
      - '.github/workflows/skills.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  published:
    name: '📦 Published Skills Must Pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the skills
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🧪 Skill gate: validates published skills against the Agent Skills specification.'

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🧪 Check Published Skills'
        uses: ./actions/check-skills
        with:
          path: skills/.unpackaged

  checker:
    name: '🚨 The Checker Must Fail'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the checker
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🚨 Negative test: asserts the skill checker still rejects known-bad input.'

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds four deliberately broken skills in a temporary directory and
      # asserts, by name, that every rule still fires. A bare non-zero exit
      # would be too weak a claim: any crash satisfies it, including one that
      # means the rules never ran at all.
      - name: '🚨 Known-Bad Input Must Be Rejected'
        uses: ./actions/check-skills
        with:
          self-test: 'true'
