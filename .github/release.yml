# GitHub auto-generated release notes configuration.
#
# THESE NOTES ARE THE ONLY CHANGELOG THIS REPOSITORY HAS. There is no
# CHANGELOG.md and no git-cliff step: `gh release create --generate-notes`
# is the whole thing. So the categories below are not cosmetic, they are the
# published history.
#
# GITHUB GROUPS BY LABEL, NOT BY COMMIT TYPE, which is the one thing to
# remember when editing this file. There is one category per Conventional
# Commit type this repository actually uses, each mapped to the label that
# carries the same meaning in the fleet's shared label set. Keeping the two
# vocabularies aligned means a release note reads like the git log instead
# of like a different project's taxonomy.
#
# Only Dependabot opens pull requests here (see .github/dependabot.yml), so
# in practice almost everything lands under Build & Dependencies today. The
# rest of the vocabulary costs nothing, is already correct if a second
# author ever appears, and a category naming a label that does not exist
# yet simply never matches.
#
# The catch-all '*' must stay last: GitHub assigns each entry to the first
# category that matches, so anything above it wins and everything else falls
# through to Maintenance.
changelog:
  exclude:
    labels:
      - 'status: stale'
      - 'duplicate'
      - 'wontfix'
      - 'invalid'
  categories:
    - title: 💥 Breaking Changes
      labels:
        - 'semver: major'
    - title: 🔒 Security
      labels:
        - 'type: security'
    - title: ✨ Features
      labels:
        - 'type: feature'
        - 'enhancement'
    - title: 🐞 Bug Fixes
      labels:
        - 'type: bug'
        - 'bug'
    - title: ⚡ Performance
      labels:
        - 'type: performance'
    - title: ♻️ Refactoring
      labels:
        - 'type: refactor'
    - title: 🧪 Tests
      labels:
        - 'type: tests'
    - title: 📚 Documentation
      labels:
        - 'type: documentation'
        - 'documentation'
    - title: 📦 Build & Dependencies
      labels:
        - 'type: build'
        - 'dependencies'
    - title: 🔁 Continuous Integration
      labels:
        - 'type: ci'
    - title: 💄 Style
      labels:
        - 'type: style'
    - title: ⏪ Reverts
      labels:
        - 'type: revert'
    - title: 🧰 Maintenance & Other
      labels:
        - 'type: chore'
        - '*'
